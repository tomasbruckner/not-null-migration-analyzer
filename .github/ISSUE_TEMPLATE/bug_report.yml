name: Bug Report
description: Report a bug with the analyzer
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Analyzer Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK Version
      placeholder: "10.0.100"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code to Reproduce
      description: Minimal code snippet that demonstrates the issue.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
